[project]
name = "mopux"
version = "0.1.0"
description = "Official Python SDK for the Mopux API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mopux", email = "support@mopux.com" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3; python_version < '3.14'",
    "pydantic>=2.12,<3; python_version >= '3.14'",
    "typing-extensions>=4.12",
]
keywords = ["mopux", "api", "sdk", "projects", "tasks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.mopux.com"
Source = "https://github.com/mopux/mopux-python"
Issues = "https://github.com/mopux/mopux-python/issues"
Changelog = "https://github.com/mopux/mopux-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.100.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pyyaml>=6",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mopux"]

[tool.hatch.build.targets.sdist]
include = ["src/mopux", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/mopux/models/_generated.py", "src/mopux/_sync"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: runs against a real installation (needs MOPUX_INTEGRATION_URL)"]
addopts = "-m 'not integration'"
